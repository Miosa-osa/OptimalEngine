version: 2026-06-11
name: optimal_engine_kernel
description: Public vocabulary kernel for Optimal Engine.

terms:
  organization:
    definition: Legal, business, team, or personal operating boundary.
    owns:
      - tenants
      - workspaces
      - policies

  tenant:
    definition: Isolation boundary for data, permissions, audit, and storage.

  workspace:
    definition: Governed operating space where Nodes, sources, memory, workflows, and agents live.
    contains:
      - nodes
      - node_relationships
      - members
      - routing_rules
      - policies

  node:
    definition: Governed topology object with identity, purpose, owner, type, relationships, state, context, decisions, tracking, and lifecycle.
    note: A folder can be an export of a Node, but a Node is not only a folder.

  project_node:
    definition: A Node representing a bounded initiative or outcome inside a Workspace.
    note: Projects are Nodes, not peers of Workspaces.

  source_package:
    definition: Preserved raw source evidence with hash, origin, permissions, retention, and provenance.

  signal:
    definition: Classified input or event produced from a source, tool result, user note, connector, or agent observation.
    dimensions:
      - mode
      - genre
      - type
      - format
      - structure

  claim:
    definition: What a source appears to assert. A Claim is not automatically true.

  fact:
    definition: Reviewed or policy-accepted assertion with evidence and validity.

  memory_object:
    definition: Source-backed remembered meaning assembled from sources, claims, facts, relationships, and context.

  context_package:
    definition: Governed retrieval output prepared for a human, agent, tool, app, or report.

  active_memory_pool:
    definition: Task-scoped working memory where humans and agents share context, observations, pending claims, tools, and audit.

  workflow_trace:
    definition: Evidence-linked record of repeated work, steps, decisions, validations, and exceptions.

  skill_package:
    definition: Validated reusable procedure with inputs, outputs, steps, checks, permissions, tools, evidence, and audit.

  package:
    definition: Outbound bundle sent to a person, team, client, partner, channel, or system.
    examples:
      - proposal
      - contract
      - status update
      - implementation brief
      - onboarding bundle

  loop:
    definition: Scheduled or goal-driven human/agent workflow with validation and promotion gates.

  projection:
    definition: Markdown, wiki, HTML, API, dashboard, report, or package view generated from governed state.
