name: Benchmarks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "benchmarks/**"
      - "lib/optimal_engine/memory_core/**"
      - "lib/optimal_engine/retrieval/**"
      - ".github/workflows/benchmarks.yml"

jobs:
  release-benchmarks:
    # This repository is public, so GitHub-hosted runners are free for it (the org-wide billing block covers private repositories only); MIOSA's self-hosted pool stopped taking this repo's jobs on 2026-11-01.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.17"
      # actions/setup-python has no build for Debian 12 (the self-hosted
      # image), so take the same Python 3.12 from uv and put it first on PATH.
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Set up Python 3.12
        run: |
          uv venv --seed --python 3.12 "$RUNNER_TEMP/python"
          echo "$RUNNER_TEMP/python/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/python/bin/python3" --version
      # RocksDB's build needs the OpenSSL headers (its encrypted env) and the
      # system zstd (the hex package has no bundled copy); hosted Ubuntu
      # shipped both, the self-hosted Debian image does not. lz4 too, so the
      # NIF has the codecs the release image (deploy/Dockerfile.engine) builds.
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install --yes libsnappy-dev libssl-dev libzstd-dev liblz4-dev
      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      - run: python3 benchmarks/scripts/release_benchmark.py --no-history
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: optimal-engine-benchmark-scorecard
          path: |
            benchmarks/results/release-current.json
            benchmarks/results/RELEASE-CURRENT.md
