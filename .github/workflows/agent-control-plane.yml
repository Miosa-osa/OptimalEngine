name: Agent control plane

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agent-control-plane-integrity:
    name: agent-control-plane-integrity
    # GitHub-hosted runners are billing-blocked org-wide, so the Linux jobs run on MIOSA's ephemeral self-hosted runners (Miosa-osa/miosa tasks/self-hosted-ci-runbook.md).
    runs-on: [self-hosted, miosa-ci, optimalengine]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: candidate
    steps:
      - name: Check out candidate without persisted credentials
        uses: actions/checkout@v4
        with:
          path: candidate
          persist-credentials: false
      - name: Check out previously trusted commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          path: trusted
          persist-credentials: false
      - name: Evaluate inside a container with read-only source mounts
        env:
          TRUSTED_EVENT_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          runner=../trusted/scripts/run_trusted_control_plane.sh
          if [[ ! -f "$runner" ]]; then
            # Initial installation is proposed policy requiring independent owner review.
            # The existing base validator and tests still run unchanged.
            runner=scripts/run_trusted_control_plane.sh
          fi
          bash "$runner" ../trusted . "$TRUSTED_EVENT_SHA" ../control-plane-artifacts
      - name: Retain trusted verdict before running candidate code on the host
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trusted-control-plane-evidence
          path: control-plane-artifacts/trusted-control-plane.json
          if-no-files-found: error
      # actions/setup-python has no build for Debian 12 (the self-hosted
      # image), so take the same Python 3.12 from uv and put it first on PATH.
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Set up Python 3.12
        run: |
          uv venv --seed --python 3.12 "$RUNNER_TEMP/python"
          echo "$RUNNER_TEMP/python/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/python/bin/python3" --version
      - name: Validate candidate authority
        run: python3 scripts/agent_control_plane.py
      - name: Authority and trusted-harness regressions
        run: python3 -m unittest discover -s scripts/tests -p 'test_*control_plane.py'
      - name: Fresh-agent evaluator regressions
        run: python3 -m unittest discover -s scripts/tests -p 'test_fresh_agent_review.py'
      - name: Authenticated wrapper routing regressions
        run: python3 -m unittest discover -s scripts/tests -p 'test_optimal_wrapper.py'
      - name: Packaged client CLI regressions
        run: python3 -m unittest discover -s scripts/tests -p 'test_optimal_cli.py'
