name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

# Cancel any in-progress CI run for the same branch when a new push lands.
# Saves Actions minutes on rapid-fire commits.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: test (Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})
    runs-on: ubuntu-latest
    # A cold cache (any mix.lock change) compiles RocksDB from source: about
    # 12 minutes on the 1.19 / OTP 28 job before the tests start.
    timeout-minutes: 25

    strategy:
      fail-fast: true
      matrix:
        include:
          # The pair the release image ships (deploy/Dockerfile.engine).
          # Formatting is checked here, with the formatter contributors use.
          - otp: "28.1.1"
            elixir: "1.19.5"
            release: true
          # The documented floor (`mix.exs` elixir: "~> 1.17"). OTP 27 is the
          # oldest runtime the HTTP stack compiles on (cowlib 2.21 uses maybe
          # expressions).
          - otp: "27.3"
            elixir: "1.17.3"
            release: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Erlang/OTP and Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install --yes libsnappy-dev

      - name: Cache deps and _build
        id: build-cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ matrix.otp }}-${{ matrix.elixir }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ matrix.otp }}-${{ matrix.elixir }}-

      - name: Install deps
        run: mix deps.get

      - name: Check formatting
        if: matrix.release
        run: mix format --check-formatted

      - name: Compile
        run: mix compile

      - name: Preserve compiled dependencies
        if: steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ matrix.otp }}-${{ matrix.elixir }}-${{ hashFiles('mix.lock') }}

      - name: Verify release version
        run: mix run --no-start scripts/check_release_version.exs

      - name: Run tests
        run: mix test
        env:
          MIX_ENV: test

  mcp:
    name: mcp server (build and test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/mcp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Build and test
        run: npm test
