name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  # Every pull request, so a PR stacked on another runs CI too.
  pull_request:

# Cancel any in-progress CI run for the same branch when a new push lands.
# Saves Actions minutes on rapid-fire commits.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only: no job writes to the repository or publishes release assets.
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    # Stable job names: branch protection requires these two checks, so a
    # toolchain move must not silently retire a required check the way
    # "test (Elixir 1.17.3 / OTP 26.2)" did. The versions are in the matrix
    # below and in the log, not in the check name.
    name: ${{ matrix.name }}
    # This repository is public, so GitHub-hosted runners are free for it (the org-wide billing block covers private repositories only); MIOSA's self-hosted pool stopped taking this repo's jobs on 2026-11-01.
    runs-on: ubuntu-24.04
    # A cold cache (any mix.lock change) compiles RocksDB from source: about
    # 12 minutes on the 1.19 / OTP 28 job before the tests start.
    timeout-minutes: 25

    # The PostgreSQL store tests (tagged :postgres) run against this
    # throwaway database; every test module works in a schema of its own.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: optimal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    strategy:
      fail-fast: true
      matrix:
        include:
          # The pair the release image ships (deploy/Dockerfile.engine).
          # Formatting is checked here, with the formatter contributors use.
          - otp: "28.5.0.5"
            elixir: "1.19.5"
            name: test-current
            release: true
          # The documented floor (`mix.exs` elixir: "~> 1.17"). OTP 27 is the
          # oldest runtime the HTTP stack compiles on (cowlib 2.21 uses maybe
          # expressions).
          - otp: "27.3"
            elixir: "1.17.3"
            name: test-floor
            release: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Erlang/OTP and Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}

      # RocksDB's build needs the OpenSSL headers (its encrypted env) and the
      # system zstd (the hex package has no bundled copy); hosted Ubuntu
      # shipped both, the self-hosted Debian image does not. lz4 too, so the
      # NIF has the codecs the release image (deploy/Dockerfile.engine) builds.
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install --yes libsnappy-dev libssl-dev libzstd-dev liblz4-dev

      # The image is part of the cache key: `runner.os` is "Linux" on hosted
      # Ubuntu and on the self-hosted Debian image alike, and a _build whose
      # NIFs (RocksDB, exqlite, bcrypt) were linked against a newer glibc fails
      # to load rather than recompiling.
      - name: Identify the runner image
        id: image
        run: . /etc/os-release && echo "id=${ID}-${VERSION_ID}" >> "$GITHUB_OUTPUT"

      - name: Cache deps and _build
        id: build-cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-${{ steps.image.outputs.id }}-mix-${{ matrix.otp }}-${{ matrix.elixir }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ steps.image.outputs.id }}-mix-${{ matrix.otp }}-${{ matrix.elixir }}-

      - name: Install deps
        run: mix deps.get

      - name: Check formatting
        if: matrix.release
        run: mix format --check-formatted

      - name: Compile
        run: mix compile

      - name: Preserve compiled dependencies
        if: steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-${{ steps.image.outputs.id }}-mix-${{ matrix.otp }}-${{ matrix.elixir }}-${{ hashFiles('mix.lock') }}

      # The analytics lockdown tests (tagged :duckdb, test/analytics/
      # analytics_duckdb_test.exs) run against the DuckDB release the Engine
      # image and the MIOSA guest ship, pinned by the same SHA-256 as
      # deploy/Dockerfile.engine. OPTIMAL_TEST_DUCKDB set to a missing or
      # broken executable fails the run (test/test_helper.exs), so the tests
      # can never be skipped here without the run saying so.
      - name: Install DuckDB 1.3.2
        env:
          DUCKDB_VERSION: "1.3.2"
          DUCKDB_SHA256_AMD64: 6156fb4e80828f04f0dde5c33d343ba230fddae0c4bc8f376e3590d255ffb999
        run: |
          set -euo pipefail
          wget -q --tries=5 --waitretry=5 --retry-connrefused --retry-on-http-error=502,503,504 \
            -O "$RUNNER_TEMP/duckdb.gz" \
            "https://github.com/duckdb/duckdb/releases/download/v${DUCKDB_VERSION}/duckdb_cli-linux-amd64.gz"
          echo "${DUCKDB_SHA256_AMD64}  $RUNNER_TEMP/duckdb.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/duckdb"
          gunzip -c "$RUNNER_TEMP/duckdb.gz" > "$RUNNER_TEMP/duckdb/duckdb"
          chmod 0755 "$RUNNER_TEMP/duckdb/duckdb"
          "$RUNNER_TEMP/duckdb/duckdb" --version
          echo "OPTIMAL_TEST_DUCKDB=$RUNNER_TEMP/duckdb/duckdb" >> "$GITHUB_ENV"

      - name: Verify release version
        run: mix run --no-start scripts/check_release_version.exs

      # The SQL census fails the run when the suite runs a statement shape the
      # PostgreSQL store refuses, rejects or leaves unordered that is not on
      # test/support/sql_census_allowlist.txt (test/support/sql_census.ex).
      - name: Run tests
        run: mix test --warnings-as-errors
        env:
          MIX_ENV: test
          OPTIMAL_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/optimal_test
          OPTIMAL_SQL_CENSUS: /tmp/sql-census.txt

      - name: SQL census report
        if: always()
        run: cat /tmp/sql-census.txt || true

  # The same engine started with the PostgreSQL store (OPTIMAL_STORE=postgres):
  # the whole suite runs with the Engine on PostgreSQL, so the two stores stay
  # at parity and code paths only the PostgreSQL store takes (full-text search
  # on posting lists, app data DDL, ...) are tested.
  test-postgres-store:
    name: test-postgres-store
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      MIX_ENV: test
      OPTIMAL_STORE: postgres
      OPTIMAL_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/optimal_test
      OPTIMAL_POSTGRES_SCHEMA: oe_ci_store
      OPTIMAL_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/optimal_test

    steps:
      - uses: actions/checkout@v4

      # Started here rather than as a service so it takes server settings: the
      # whole suite runs serializable transactions side by side, which needs
      # more predicate locks and connections than the defaults.
      - name: Start PostgreSQL 16
        run: |
          docker run --detach --name postgres -p 5432:5432 \
            -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=optimal_test \
            postgres:16 -c max_connections=300 -c max_pred_locks_per_transaction=512
          for _ in $(seq 60); do
            docker exec postgres pg_isready -U postgres -d optimal_test && exit 0
            sleep 2
          done
          exit 1

      - name: Set up Erlang/OTP and Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "28.5.0.5"
          elixir-version: "1.19.5"

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install --yes libsnappy-dev libssl-dev libzstd-dev liblz4-dev

      - name: Identify the runner image
        id: image
        run: . /etc/os-release && echo "id=${ID}-${VERSION_ID}" >> "$GITHUB_OUTPUT"

      # The SQLite job's cache: the dependencies are the same, and the one
      # module that reads the store choice recompiles.
      - name: Restore deps and _build
        uses: actions/cache/restore@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-${{ steps.image.outputs.id }}-mix-28.5.0.5-1.19.5-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ steps.image.outputs.id }}-mix-28.5.0.5-1.19.5-

      - name: Install deps
        run: mix deps.get

      # The store is chosen when the Engine boots, so the SQLite job's _build
      # runs here unchanged.
      - name: Compile
        run: mix compile --warnings-as-errors

      # The whole suite, as the SQLite job runs it, with the Engine's store on
      # PostgreSQL. Tests of SQLite itself are tagged :sqlite_store and left
      # out (test/test_helper.exs); each names its PostgreSQL counterpart.
      - name: Run the suite on the PostgreSQL store
        run: mix test --warnings-as-errors

  mcp:
    name: mcp server (build and test)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/mcp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Build and test
        run: npm test

  client:
    # The files a machine needs to use an Engine: the CLI archives and the MCP
    # server archive with SHA256SUMS. Built and installed on every run. This job
    # runs pull request code and npm, so it holds no write token.
    name: client CLI and MCP release files
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build the CLI and MCP server archives
        run: |
          apps/cli/build.sh dist/client
          apps/mcp/build.sh dist/client
          cat dist/client/SHA256SUMS

      # A hosted runner runs every step as the unprivileged user "runner". The
      # self-hosted runner is root, and the installer deliberately acts
      # differently for root (it will not write through a user's symlink), so
      # the tests run as an ordinary account there, as they did before.
      - name: Test the CLI and install the built files
        env:
          OPTIMAL_CLIENT_TEST_RELEASE_DIR: dist/client
        run: |
          as_user=()
          if [ "$(id -u)" = 0 ]; then
            id -u ci-unprivileged >/dev/null 2>&1 || useradd --create-home ci-unprivileged
            chown -R ci-unprivileged: "$GITHUB_WORKSPACE"
            as_user=(setpriv --reuid=ci-unprivileged --regid=ci-unprivileged --init-groups -- env HOME=/home/ci-unprivileged)
          fi
          "${as_user[@]}" python3 -m unittest discover -s scripts/tests -p 'test_optimal_cli.py'
          "${as_user[@]}" python3 -m unittest discover -s scripts/tests -p 'test_install_client.py'

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: optimal-client
          path: dist/client/
          if-no-files-found: error
