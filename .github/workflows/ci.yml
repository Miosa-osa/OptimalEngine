name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

# Cancel any in-progress CI run for the same branch when a new push lands.
# Saves Actions minutes on rapid-fire commits.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only: no job writes to the repository or publishes release assets.
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    # Stable job names: branch protection requires these two checks, so a
    # toolchain move must not silently retire a required check the way
    # "test (Elixir 1.17.3 / OTP 26.2)" did. The versions are in the matrix
    # below and in the log, not in the check name.
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    # A cold cache (any mix.lock change) compiles RocksDB from source: about
    # 12 minutes on the 1.19 / OTP 28 job before the tests start.
    timeout-minutes: 25

    # The PostgreSQL store tests (tagged :postgres) run against this
    # throwaway database; every test module works in a schema of its own.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: optimal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    strategy:
      fail-fast: true
      matrix:
        include:
          # The pair the release image ships (deploy/Dockerfile.engine).
          # Formatting is checked here, with the formatter contributors use.
          - otp: "28.5.0.5"
            elixir: "1.19.5"
            name: test-current
            release: true
          # The documented floor (`mix.exs` elixir: "~> 1.17"). OTP 27 is the
          # oldest runtime the HTTP stack compiles on (cowlib 2.21 uses maybe
          # expressions).
          - otp: "27.3"
            elixir: "1.17.3"
            name: test-floor
            release: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Erlang/OTP and Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install --yes libsnappy-dev

      - name: Cache deps and _build
        id: build-cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ matrix.otp }}-${{ matrix.elixir }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ matrix.otp }}-${{ matrix.elixir }}-

      - name: Install deps
        run: mix deps.get

      - name: Check formatting
        if: matrix.release
        run: mix format --check-formatted

      - name: Compile
        run: mix compile

      - name: Preserve compiled dependencies
        if: steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ matrix.otp }}-${{ matrix.elixir }}-${{ hashFiles('mix.lock') }}

      - name: Verify release version
        run: mix run --no-start scripts/check_release_version.exs

      # The SQL census fails the run when the suite runs a statement shape the
      # PostgreSQL store refuses, rejects or leaves unordered that is not on
      # test/support/sql_census_allowlist.txt (test/support/sql_census.ex).
      - name: Run tests
        run: mix test --warnings-as-errors
        env:
          MIX_ENV: test
          OPTIMAL_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/optimal_test
          OPTIMAL_SQL_CENSUS: /tmp/sql-census.txt

      - name: SQL census report
        if: always()
        run: cat /tmp/sql-census.txt || true

  mcp:
    name: mcp server (build and test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/mcp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Build and test
        run: npm test

  client:
    # The files a machine needs to use an Engine: the CLI archives and the MCP
    # server archive with SHA256SUMS. Built and installed on every run. This job
    # runs pull request code and npm, so it holds no write token.
    name: client CLI and MCP release files
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build the CLI and MCP server archives
        run: |
          apps/cli/build.sh dist/client
          apps/mcp/build.sh dist/client
          cat dist/client/SHA256SUMS

      - name: Test the CLI and install the built files
        env:
          OPTIMAL_CLIENT_TEST_RELEASE_DIR: dist/client
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_optimal_cli.py'
          python3 -m unittest discover -s scripts/tests -p 'test_install_client.py'

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: optimal-client
          path: dist/client/
          if-no-files-found: error
